name: Public deployment smoke
on:
  pull_request:
    paths:
      - 'scripts/verify-public-deployment.mjs'
      - '.github/workflows/public-smoke.yml'
permissions:
  contents: read
concurrency:
  group: public-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify-public-deployment.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-deployment-evidence-${{ github.sha }}
          path: test-results/public-deployment/
          retention-days: 14
