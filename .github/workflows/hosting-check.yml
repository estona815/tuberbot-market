name: Hosting diagnostics
on:
  pull_request:
    paths: ['.github/workflows/hosting-check.yml']
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect public production domains without credentials
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const hosts = [
            'tuberbot-market-review.vercel.app',
            'tuberbot-review.vercel.app',
            'tuberbot-rate-studio.vercel.app',
            'tuberbot-market-review-kwonj0815-2863s-projects.vercel.app'
          ];
          const result = await Promise.all(hosts.map(async host => {
            try {
              const response = await fetch(`https://${host}/release.json`, { redirect:'manual', signal: AbortSignal.timeout(20000) });
              return { host, status: response.status, location: response.headers.get('location'), body: (await response.text()).slice(0,3000) };
            } catch(error) { return { host, error: String(error) }; }
          }));
          console.log(JSON.stringify(result,null,2));
          await writeFile('hosting-status.json', JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: hosting-diagnostics-${{ github.sha }}
          path: hosting-status.json
          retention-days: 7
